name: OctaTycoon
version: "@project.version@"
main: id.octanexus.octatycoon.OctaTycoonPlugin
api-version: '1.21'
author: [Alvran, RafyRafi]
description: Native tycoon / idle-RPG foundation for Octanexus.
softdepend: [Vault, ExcellentEconomy, PlaceholderAPI, LuckPerms, Citizens, SuperiorSkyblock2, floodgate, Geyser-Spigot, TAB]
commands:
  kuy:
    description: OctaTycoon administration command.
    aliases: [kuyguard]
    usage: /kuy <status|guard|freeze|unfreeze|audit|player|eco|dryrun|backup>
    permission: octatycoon.admin.core
  testadmin:
    description: Open the OctaTycoon core admin test menu.
    usage: /testadmin
    permission: octatycoon.admin.core
  progress:
    description: View your combined OctaTycoon progression.
    usage: /progress
    permission: octatycoon.cmd.progress
  mastery:
    description: View your OctaTycoon mastery points.
    usage: /mastery
    permission: octatycoon.cmd.mastery
permissions:
  octatycoon.admin.core:
    description: Access to OctaTycoon core administration.
    default: op
  octatycoon.admin.audit:
    description: View OctaTycoon audit information.
    default: op
  octatycoon.cmd.progress:
    description: View OctaTycoon progression.
    default: true
  octatycoon.cmd.mastery:
    description: View OctaTycoon mastery.
    default: true
  octatycoon.mine.*:
    description: Bypass OctaTycoon mining permits.
    default: op
    children:
      octatycoon.mine.coal: true
      octatycoon.mine.copper: true
      octatycoon.mine.iron: true
      octatycoon.mine.gold: true
      octatycoon.mine.lapis: true
      octatycoon.mine.redstone: true
      octatycoon.mine.emerald: true
      octatycoon.mine.diamond: true
      octatycoon.mine.ancient_debris: true
