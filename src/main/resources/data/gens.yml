# Production rates are examples until measured against the original Skript economy.
generators:
  wheat: { material: HAY_BLOCK, output: WHEAT, base-price: 1, items-per-hour: 120 }
  coal: { material: COAL_BLOCK, output: COAL, base-price: 12, items-per-hour: 80 }
  iron: { material: IRON_BLOCK, output: RAW_IRON, base-price: 20, items-per-hour: 60 }
  gold: { material: GOLD_BLOCK, output: RAW_GOLD, base-price: 28, items-per-hour: 50 }
  diamond: { material: DIAMOND_BLOCK, output: DIAMOND, base-price: 90, items-per-hour: 20 }
  emerald: { material: EMERALD_BLOCK, output: EMERALD, base-price: 110, items-per-hour: 18 }
  redstone: { material: REDSTONE_BLOCK, output: REDSTONE, base-price: 8, items-per-hour: 100 }
  lapis: { material: LAPIS_BLOCK, output: LAPIS_LAZULI, base-price: 9, items-per-hour: 90 }
  copper: { material: COPPER_BLOCK, output: RAW_COPPER, base-price: 10, items-per-hour: 90 }
  quartz: { material: QUARTZ_BLOCK, output: QUARTZ, base-price: 16, items-per-hour: 70 }
  beacon: { material: BEACON, output: BEACON, base-price: 1000, items-per-hour: 1 }
progression:
  tier-cap: 100
  stars-cap: 10
  storage-base: 36
  overclock-multiplier: 2.0
  max-external-multiplier: 1.6
